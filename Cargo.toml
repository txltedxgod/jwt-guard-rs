[package]
name = "jwt-guard-rs"
version = "0.1.0"
edition = "2021"
authors = ["txltedxgod <seidoutakidzava@gmail.com>"]
description = "High-speed JWT authentication and token revocation gateway with Axum and Redis"
readme = "README.md"
license = "MIT"

[dependencies]
axum = "0.7"
tokio = { version = "1.36", features = ["full"] }
jsonwebtoken = "9.2"
redis = { version = "1.6", features = ["tokio-comp", "connection-manager"] }
argon2 = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
